spring.application.name=docusense

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/docusense_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#docusense.upload-dir=uploads

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.expiration.remember-me=2592000000

docusense.password-reset.token-expiry-minutes=30
docusense.frontend-url=${FRONTEND_URL:http://localhost:5173}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

server.port=8080